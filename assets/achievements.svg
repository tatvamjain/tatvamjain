    <rect class="sh" style="animation-delay:0.7s" x="305" y="0" width="2" height="170" fill="#4ADE80" opacity=".7"/>
  </g>
  <rect x="305.5" y=".5" width="284" height="169" rx="12" stroke="#262626"/>
  <text x="327" y="36" font-size="12" fill="#4ADE80">[02]</text>
  <text x="327" y="88" font-size="30" font-weight="800" fill="#EDEDED" letter-spacing="-1">RUNNER-UP</text>
  <text x="327" y="122" font-size="14.5" font-weight="700" fill="#B4B4B4">ACM Hacklipse</text>
  <text x="327" y="145" font-size="12.5" fill="#6E6E6E">Hackathon · Jan 2026</text>
</g>
<g class="ln" style="animation-delay:0.24s">
  <g clip-path="url(#t2)">
    <rect x="610" y="0" width="285" height="170" fill="#111111"/>
    <rect x="610" y="0" width="285" height="170" fill="url(#dots)"/>
    <rect class="sh" style="animation-delay:1.4s" x="610" y="0" width="2" height="170" fill="#4ADE80" opacity=".7"/>
  </g>
  <rect x="610.5" y=".5" width="284" height="169" rx="12" stroke="#262626"/>
  <text x="632" y="36" font-size="12" fill="#4ADE80">[03]</text>
  <text x="632" y="88" font-size="36" font-weight="800" fill="#EDEDED" letter-spacing="-1">MERIT</text>
  <text x="632" y="122" font-size="14.5" font-weight="700" fill="#B4B4B4">University Merit</text>
  <text x="632" y="145" font-size="12.5" fill="#6E6E6E">Scholarship · 2023–26</text>
</g>
