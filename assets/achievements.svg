<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" fill="none">
<defs><clipPath id="t0"><rect x="0" y="0" width="285" height="170" rx="12"/></clipPath><clipPath id="t1"><rect x="305" y="0" width="285" height="170" rx="12"/></clipPath><clipPath id="t2"><rect x="610" y="0" width="285" height="170" rx="12"/></clipPath><clipPath id="t3"><rect x="915" y="0" width="285" height="170" rx="12"/></clipPath><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1C1C1C"/></pattern></defs>
<style>
text { font-family: 'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
.blink { animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.in { animation: in .55s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ln { animation: in .55s ease-out both; }
.sh { animation: sh 4.2s ease-in-out infinite; }
@keyframes sh { 0% { transform: translateX(0); opacity: 0; } 10% { opacity: .7; } 45% { transform: translateX(283px); opacity: .7; } 50%,100% { transform: translateX(283px); opacity: 0; } }
</style>

<g class="ln" style="animation-delay:0.00s">
  <g clip-path="url(#t0)">
    <rect x="0" y="0" width="285" height="170" fill="#111111"/>
    <rect x="0" y="0" width="285" height="170" fill="url(#dots)"/>
    <rect class="sh" style="animation-delay:0.0s" x="0" y="0" width="2" height="170" fill="#4ADE80" opacity=".7"/>
  </g>
  <rect x="0.5" y=".5" width="284" height="169" rx="12" stroke="#262626"/>
  <text x="22" y="36" font-size="12" fill="#4ADE80">[01]</text>
  <text x="22" y="88" font-size="36" font-weight="800" fill="#EDEDED" letter-spacing="-1">WINNER</text>
  <text x="22" y="122" font-size="14.5" font-weight="700" fill="#B4B4B4">Amex Product Track</text>
  <text x="22" y="145" font-size="12.5" fill="#6E6E6E">Challenge · Jun 2025</text>
</g>
<g class="ln" style="animation-delay:0.12s">
  <g clip-path="url(#t1)">
    <rect x="305" y="0" width="285" height="170" fill="#111111"/>
