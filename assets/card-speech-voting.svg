<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#4ADE80" stop-opacity="0"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></linearGradient></defs>
<style>
text { font-family: 'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
.blink { animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.in { animation: in .55s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ln { animation: in .5s ease-out both; }
.topscan { animation: ts 3.2s linear infinite; }
@keyframes ts { from { transform: translateX(-200px); } to { transform: translateX(600px); } }
</style>

