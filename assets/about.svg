.blink { animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.in { animation: in .55s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.px { animation: px .4s cubic-bezier(.2,.9,.3,1.4) both, glow 5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes px { from { opacity: 0; transform: scale(.3); } to { opacity: 1; transform: none; } }
@keyframes glow { 0%,82%,100% { fill: #EDEDED; } 88% { fill: #4ADE80; } }
.ln { animation: in .5s ease-out both; }

</style>

