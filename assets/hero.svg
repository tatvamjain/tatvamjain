<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1C1C1C"/></pattern>
<linearGradient id="sl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ADE80" stop-opacity="0"/><stop offset="1" stop-color="#4ADE80" stop-opacity=".035"/></linearGradient>
<clipPath id="c"><rect width="1200" height="400" rx="16"/></clipPath></defs>
<style>
text { font-family: 'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
.blink { animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.in { animation: in .55s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.role { opacity: 0; animation: role 12s ease-in-out infinite both; } .role.r0 { opacity: 1; }
@keyframes role { 0% { opacity: 0; transform: translateY(10px); } 4% { opacity: 1; transform: none; }
  21% { opacity: 1; transform: none; } 25% { opacity: 0; transform: translateY(-10px); } 100% { opacity: 0; } }
.log { animation: log 9s ease-out infinite both; }
@keyframes log { 0% { opacity: 0; transform: translateX(-8px); } 5% { opacity: 1; transform: none; } 85% { opacity: 1; } 95%,100% { opacity: 0; } }
.sweep { animation: sweep 6s linear infinite; }
@keyframes sweep { from { transform: translateY(-120px); } to { transform: translateY(400px); } }
.pulse { animation: pulse 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(3.2); opacity: 0; } }

</style>

<g clip-path="url(#c)">
  <rect width="1200" height="400" fill="#0A0A0A"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <rect class="sweep" width="1200" height="120" fill="url(#sl)"/>
</g>
