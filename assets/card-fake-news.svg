<svg xmlns="http://www.w3.org/2000/svg" width="580" height="330" viewBox="0 0 580 330" fill="none">
<defs>
<clipPath id="fr"><rect width="580" height="330" rx="12"/></clipPath>
<linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#4ADE80" stop-opacity="0"/><stop offset=".5" stop-color="#4ADE80"/><stop offset="1" stop-color="#4ADE80" stop-opacity="0"/></linearGradient></defs>
<style>
text { font-family: 'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace; }
.blink { animation: blink 1.05s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.in { animation: in .55s ease-out both; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.ln { animation: in .5s ease-out both; }
.topscan { animation: ts 3.2s linear infinite; }
@keyframes ts { from { transform: translateX(-200px); } to { transform: translateX(600px); } }
</style>

<g clip-path="url(#fr)">
  <rect width="580" height="330" fill="#111111"/>
  <rect width="580" height="40" fill="#161616"/>
  <rect y="40" width="580" height="1" fill="#262626"/>
</g>
<rect x=".5" y=".5" width="579" height="329" rx="12" stroke="#262626"/>
<circle cx="22" cy="20" r="5.5" fill="#3A3A3A"/><circle cx="40" cy="20" r="5.5" fill="#3A3A3A"/><circle cx="58" cy="20" r="5.5" fill="#3A3A3A"/>
<text x="290.0" y="25" font-size="12.5" fill="#6E6E6E" text-anchor="middle">~/projects/fake-news-detector</text>

<rect class="topscan" x="0" y="40" width="200" height="1.5" fill="url(#bg)"/>
<text x="562" y="25" font-size="11.5" fill="#6E6E6E" text-anchor="end">Jupyter</text>
<text x="28" y="76" font-size="20" font-weight="800" fill="#EDEDED">Fake News Detector<tspan class="blink" fill="#4ADE80">_</tspan></text>

<text x="28" y="108" font-size="13.5" fill="#B4B4B4">NLP pipeline classifying news articles as real or fake,</text><text x="28" y="129" font-size="13.5" fill="#B4B4B4">comparing Logistic Regression, Random Forest and</text><text x="28" y="150" font-size="13.5" fill="#B4B4B4">SVM classifiers on engineered text features.</text>
<text class="ln" style="animation-delay:.3s" x="28" y="206" font-size="28" font-weight="800" fill="#EDEDED">3</text><text class="ln" style="animation-delay:.4s" x="28" y="228" font-size="12" fill="#6E6E6E">models compared</text><text class="ln" style="animation-delay:.3s" x="172.0" y="206" font-size="28" font-weight="800" fill="#EDEDED">NLP</text><text class="ln" style="animation-delay:.4s" x="172.0" y="228" font-size="12" fill="#6E6E6E">text features</text>

<line x1="0" y1="256" x2="580" y2="256" stroke="#262626"/>
<g class="ln" style="animation-delay:0.40s"><rect x="28" y="276" width="63" height="26" rx="5" fill="#0A0A0A" stroke="#262626"/><text x="60" y="293" font-size="12" fill="#B4B4B4" text-anchor="middle">Python</text></g><g class="ln" style="animation-delay:0.47s"><rect x="98.19999999999999" y="276" width="106" height="26" rx="5" fill="#0A0A0A" stroke="#262626"/><text x="151" y="293" font-size="12" fill="#B4B4B4" text-anchor="middle">scikit-learn</text></g><g class="ln" style="animation-delay:0.54s"><rect x="211.59999999999997" y="276" width="42" height="26" rx="5" fill="#0A0A0A" stroke="#262626"/><text x="232" y="293" font-size="12" fill="#B4B4B4" text-anchor="middle">NLP</text></g><g class="ln" style="animation-delay:0.61s"><rect x="260.19999999999993" y="276" width="42" height="26" rx="5" fill="#0A0A0A" stroke="#262626"/><text x="281" y="293" font-size="12" fill="#B4B4B4" text-anchor="middle">SVM</text></g><g class="ln" style="animation-delay:0.68s"><rect x="308.79999999999995" y="276" width="114" height="26" rx="5" fill="#0A0A0A" stroke="#262626"/><text x="366" y="293" font-size="12" fill="#B4B4B4" text-anchor="middle">Random Forest</text></g>

</svg>